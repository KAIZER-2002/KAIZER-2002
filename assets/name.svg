<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%" height="100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6edf3" />
      <stop offset="30%" stop-color="#7c3aed" />
      <stop offset="55%" stop-color="#58a6ff" />
      <stop offset="80%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#e6edf3" />
      <!-- Animate the gradient for a shimmer effect -->
      <animate attributeName="x1" values="0%;200%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="100%;300%" dur="4s" repeatCount="indefinite" />
    </linearGradient>
    <style>
      .text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 38px;
        font-weight: 800;
        fill: url(#gradient);
        text-anchor: middle;
        dominant-baseline: middle;
      }
      .w {
        animation: wave 1.8s ease-in-out infinite;
      }
      @keyframes wave {
        0%, 60%, 100% { transform: translateY(0); }
        30% { transform: translateY(-8px); }
      }
      .w:nth-child(1)  { animation-delay: 0.00s; }
      .w:nth-child(2)  { animation-delay: 0.06s; }
      .w:nth-child(3)  { animation-delay: 0.12s; }
      .w:nth-child(4)  { animation-delay: 0.18s; }
      .w:nth-child(5)  { animation-delay: 0.24s; }
      .w:nth-child(6)  { animation-delay: 0.30s; }
      .w:nth-child(7)  { animation-delay: 0.36s; }
      .w:nth-child(8)  { animation-delay: 0.42s; }
      .w:nth-child(9)  { animation-delay: 0.48s; }
      .w:nth-child(10) { animation-delay: 0.54s; }
      .w:nth-child(11) { animation-delay: 0.60s; }
      .w:nth-child(12) { animation-delay: 0.66s; }
      .w:nth-child(13) { animation-delay: 0.72s; }
      .w:nth-child(14) { animation-delay: 0.78s; }
      .w:nth-child(15) { animation-delay: 0.84s; }
      .w:nth-child(16) { animation-delay: 0.90s; }
      .w:nth-child(17) { animation-delay: 0.96s; }
      .w:nth-child(18) { animation-delay: 1.02s; }
      .w:nth-child(19) { animation-delay: 1.08s; }
    </style>
  </defs>

  <text x="400" y="50" class="text">
    <tspan class="w">S</tspan><tspan class="w">w</tspan><tspan class="w">a</tspan><tspan class="w">p</tspan><tspan class="w">n</tspan><tspan class="w">i</tspan><tspan class="w">l</tspan>
    <tspan> </tspan>
    <tspan class="w">N</tspan><tspan class="w">a</tspan><tspan class="w">n</tspan><tspan class="w">d</tspan><tspan class="w">i</tspan>
    <tspan> </tspan>
    <tspan class="w">U</tspan><tspan class="w">t</tspan><tspan class="w">s</tspan><tspan class="w">h</tspan><tspan class="w">a</tspan>
  </text>
</svg>
